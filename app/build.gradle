plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tracecroquis'
    compileSdk 33

    defaultConfig {
        applicationId "com.tracecroquis"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// ML Kit entraine d'anciens artefacts kotlin-stdlib-jdk7/jdk8 qui font doublon
// avec kotlin-stdlib 1.8 : on aligne tout sur la meme version.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'

    // OCR facultatif (noms de pieces, surfaces, cotes manuscrites).
    // Pour compiler hors-ligne : ajouter  tracecroquis.mlkit=false  dans gradle.properties.
    // Le code n'appelle ML Kit que par reflexion : l'application compile et
    // fonctionne meme si cette dependance est absente.
    if (project.findProperty('tracecroquis.mlkit') != 'false') {
        implementation 'com.google.mlkit:text-recognition:16.0.0'
    }
}
