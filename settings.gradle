        google()
        // Miroir Google de Maven Central : evite les limitations de debit
        // de repo.maven.apache.org. Gradle bascule sur mavenCentral() si besoin.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = "TraceCroquis"
include ':app'
